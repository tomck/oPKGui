name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    # Real (non-noarch) architectures need spksrc's own per-arch toolchain
    # download, which breaks locally under Docker Desktop's bind mount on
    # macOS (see DESIGN.md's Round 4 / TESTING.md) -- Linux runners don't
    # have that bug, which is the whole reason this workflow exists.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, aarch64]
        # 7.2 covers current models (e.g. aarch64 DS223/DS423); 7.1 is still
        # the floor for older ones still on that toolchain generation -- see
        # spksrc's own docs/reference/architectures.md.
        tcversion: ["7.1", "7.2"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: pkgsrc/opkgui/cmd/opkgui/go.mod

      - name: Build oPKGui .spk for ${{ matrix.arch }} (TCVERSION=${{ matrix.tcversion }})
        run: ARCH=${{ matrix.arch }} TCVERSION=${{ matrix.tcversion }} ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: opkgui-${{ matrix.arch }}-${{ matrix.tcversion }}
          path: dist/opkgui_*.spk

  release:
    # Only publish a real GitHub Release on an actual version tag (e.g.
    # v0.1.0) -- not on every push, which the build job above already
    # covers as ordinary CI validation via ephemeral Actions artifacts.
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: opkgui-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --title "${{ github.ref_name }}" \
              --generate-notes \
              dist/opkgui_*.spk
